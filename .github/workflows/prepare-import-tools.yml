name: Prepare import tools

on:
  push:
    branches: [import/clash-gog-32003]
    paths: [.github/workflows/prepare-import-tools.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraction-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download upstream innoextract 1.9 binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl --fail --location --retry 3 https://constexpr.org/innoextract/files/innoextract-1.9-linux.tar.xz -o tools/innoextract-1.9-linux.tar.xz
          echo '33bdf359c62d4f88a51ae15048ea480e  tools/innoextract-1.9-linux.tar.xz' | md5sum --check
          sha256sum tools/innoextract-1.9-linux.tar.xz > tools/SHA256SUMS
      - name: Package extraction tools
        uses: actions/upload-artifact@v4
        with:
          name: clash-import-tools
          path: tools/
          retention-days: 7
          if-no-files-found: error
